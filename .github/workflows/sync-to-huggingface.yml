name: Sync homepage to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: huggingface-homepage
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare website and Space metadata
        run: |
          mkdir -p "$RUNNER_TEMP/homepage"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/.chrome-headless/' --exclude='/.edge-headless/' --exclude='/AGENTS.md' --exclude='/README.md' ./ "$RUNNER_TEMP/homepage/"
          echo '---' > "$RUNNER_TEMP/homepage/README.md"
          echo 'title: Xiangchun Chen' >> "$RUNNER_TEMP/homepage/README.md"
          echo 'emoji: 📚' >> "$RUNNER_TEMP/homepage/README.md"
          echo 'colorFrom: blue' >> "$RUNNER_TEMP/homepage/README.md"
          echo 'colorTo: gray' >> "$RUNNER_TEMP/homepage/README.md"
          echo 'sdk: static' >> "$RUNNER_TEMP/homepage/README.md"
          echo 'app_file: index.html' >> "$RUNNER_TEMP/homepage/README.md"
          echo '---' >> "$RUNNER_TEMP/homepage/README.md"
      - name: Install Hugging Face CLI
        run: python -m pip install 'huggingface_hub[cli]>=1.19.0'
      - name: Publish website
        env:
          HF_OIDC_RESOURCE: spaces/XiangchunChen/homepage
        shell: python
        run: |
          import json
          import os
          import subprocess
          from glob import escape
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          from huggingface_hub.errors import RemoteEntryNotFoundError

          repo = "XiangchunChen/homepage"
          site = Path(os.environ["RUNNER_TEMP"]) / "homepage"
          manifest = ".hf-sync-files.json"
          current = {p.relative_to(site).as_posix() for p in site.rglob("*") if p.is_file()}
          try:
              previous = json.loads(Path(hf_hub_download(repo, manifest, repo_type="space")).read_text())
          except RemoteEntryNotFoundError:
              previous = []  # First run records the baseline without deleting Space-only files.
          (site / manifest).write_text(json.dumps(sorted(current)) + "\n")
          deleted = sorted(set(previous) - current)
          subprocess.run([
              "hf", "upload", repo, str(site), ".", "--repo-type", "space",
              "--commit-message", "Sync GitHub " + os.environ["GITHUB_SHA"],
              *["--delete=" + escape(path) for path in deleted],
          ], check=True)
